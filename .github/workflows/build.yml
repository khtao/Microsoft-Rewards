name: Build packages

# 主分支推送、版本标签、PR 与手动触发都会跑完整流水线。
# 三个产物：Ubuntu/Debian .deb、Windows 单文件安装向导 exe、macOS .app/.dmg。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 离线测试
  test:
    name: Unit tests (Qt offscreen)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      # QT_QPA_PLATFORM=offscreen 只决定用哪个平台插件；PySide6 的
      # libQt6Gui.so.6 在 import 阶段就按 DT_NEEDED 找 libEGL.so.1 / libGL.so.1，
      # 与是否真的显示窗口无关。runner 默认不带这些库，pytest 收集阶段
      # 就会 ImportError，且三个打包 job 都 needs: test 会一起被跳过。
      - name: Install Qt base runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libx11-6 libxkbcommon0

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # 把「系统库没装好」和「测试用例本身失败」在日志里分开。
      - name: Verify Qt imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtGui import QAction; from PySide6.QtTest import QTest; print('Qt imports OK')"

      - name: Run offline test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Check shell scripts
        run: bash -n build_ubuntu.sh && bash -n build_deb.sh && bash -n build_macos.sh

  # ------------------------------------------------------- Ubuntu / Debian .deb
  ubuntu:
    name: Ubuntu .deb (amd64)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      # PyInstaller 解析 Qt 插件的 DT_NEEDED 时需要 Qt xcb 运行库；列表与
      # build_deb.sh 生成的 CONTROL Depends 对齐。Ubuntu 22.04 的源里没有
      # libxcb-cursor0，单独尽力安装，缺失时只留一条非致命警告。
      - name: Install Qt xcb runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libx11-6 libx11-xcb1 libxext6 libxi6 libxrender1 libxrandr2 \
            libxcb1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 || \
            echo "::warning::libxcb-cursor0 unavailable on this Ubuntu release; PyInstaller may emit a non-fatal 'Library not found' warning"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      # build_ubuntu.sh 默认用 python3；显式指定 setup-python 的解释器，避免
      # pip 装到 3.12、PyInstaller 却跑在 runner 自带的系统 Python 上。
      - name: Build .deb
        env:
          PYTHON: python
        run: bash build_deb.sh

      - name: Verify package contents
        run: |
          set -euo pipefail
          DEB=$(ls deb-dist/*.deb)
          dpkg-deb --info "$DEB"
          LIST=$(dpkg-deb --contents "$DEB")
          # 用 bash 自身做子串匹配，避免 pipefail 下 printf | grep -q 的
          # EPIPE 被误判成「文件缺失」。
          for pat in \
            './opt/ms-rewards-assistant/MSRewardsAssistant' \
            '_internal/base_library.zip' \
            '_internal/PySide6/Qt/plugins/platforms/libqxcb.so' \
            '_internal/assets/icons/app.svg' \
            '_internal/playwright/driver/node' \
            'usr/bin/ms-rewards-assistant' \
            'usr/share/applications/ms-rewards-assistant.desktop'; do
            [[ "$LIST" == *"$pat"* ]] || {
              echo "::error::missing from package: $pat"; exit 1; }
          done
          # 顶层 shiboken6 必须是普通文件；dpkg-deb --contents 的类型列以
          # '-' 开头，'l' 开头表示 symlink，解包到别的机器会加载失败。
          TOP=$(printf '%s\n' "$LIST" | grep -E '\./opt/ms-rewards-assistant/_internal/libshiboken6[^/]*\.so' || true)
          [[ -n "$TOP" && "$TOP" == -* ]] || {
            echo '::error::top-level shiboken6 library is missing or not a regular file'; exit 1; }
          EXPECTED=$(PYTHONPATH=. python3 -c 'from rewards_assistant.config import APP_VERSION; print(APP_VERSION)')
          ACTUAL=$(dpkg-deb --field "$DEB" Version)
          echo "Package version: $ACTUAL (expected $EXPECTED)"
          [[ "$ACTUAL" = "$EXPECTED" ]] || {
            echo '::error::deb version does not match config.APP_VERSION'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ms-rewards-assistant-deb-amd64
          path: deb-dist/*.deb
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------- Windows 安装包
  windows:
    name: Windows setup.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build PyInstaller onedir
        shell: cmd
        run: |
          set "PYTHON=python"
          call build_windows.bat
          if errorlevel 1 exit /b 1

      # Inno Setup 只在打包机需要；runner 已自带时 choco 会幂等跳过。
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress --limit-output

      # 不加静默参数：ISCC 的编译输出是 CI 里定位 .isl / [Files] 错误的唯一线索。
      - name: Build single-file installer
        shell: cmd
        run: |
          call installer\build_inno.bat --no-build
          if errorlevel 1 exit /b 1

      - name: Verify installer
        shell: pwsh
        run: |
          $f = Get-Item MSRewardsAssistantSetup.exe
          if ($f.Length -lt 100000) { throw "installer too small: $($f.Length) bytes" }
          Write-Host "MSRewardsAssistantSetup.exe: $($f.Length) bytes"
          Write-Host "ProductVersion: $($f.VersionInfo.ProductVersion)"
          $internal = 'dist\MSRewardsAssistant\_internal'
          $libs = @(Get-ChildItem $internal -Filter 'shiboken6*.dll' -File -ErrorAction SilentlyContinue)
          if (-not $libs) {
            $libs = @(Get-ChildItem $internal -Filter 'libshiboken6*.dll' -File -ErrorAction SilentlyContinue)
          }
          if (-not $libs) { throw 'shiboken6 DLL missing from _internal root' }
          foreach ($lib in $libs) {
            if ($lib.LinkType) { throw "$($lib.Name) is a symlink; must be a real file" }
          }
          Write-Host "shiboken6 DLL: $(($libs | Select-Object -ExpandProperty Name) -join ', ')"

      - uses: actions/upload-artifact@v4
        with:
          name: ms-rewards-assistant-windows-setup
          path: MSRewardsAssistantSetup.exe
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------- macOS 应用包
  macos:
    name: macOS .app / .dmg
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      # runner 自带系统 python3，显式锁定 setup-python 的解释器，避免 pip
      # 与 PyInstaller 落在不同版本上（与 Ubuntu job 同一处理）。
      - name: Build .app and .dmg
        env:
          PYTHON: python
        run: bash build_macos.sh

      - name: Verify app bundle and DMG
        run: |
          set -euo pipefail
          APP=dist/MSRewardsAssistant.app
          test -x "$APP/Contents/MacOS/MSRewardsAssistant"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          E=$(PYTHONPATH=. python -c 'from rewards_assistant.config import APP_VERSION; print(APP_VERSION)')
          echo "Info.plist version: $V (expected $E)"
          test "$V" = "$E"
          test -n "$(find "$APP/Contents" -name libqcocoa.dylib -print -quit)" || {
            echo '::error::Qt cocoa platform plugin missing from app bundle'; exit 1; }
          DMG=$(ls macos-dist/*.dmg)
          hdiutil imageinfo "$DMG" >/dev/null
          echo "DMG: $DMG ($(stat -f%z "$DMG") bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: ms-rewards-assistant-macos-dmg
          path: macos-dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------ 版本标签挂到 Release
  release:
    name: Attach packages to release
    needs: [ubuntu, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) \
            -exec cp {} release-files/ \;
          # 三个平台的产物必须同时存在，否则宁可让 release job 失败，
          # 也不要发出一个只有一半安装包的 Release。
          test -n "$(find release-files -name '*.deb' -print -quit)" || {
            echo '::error::no .deb artifact'; exit 1; }
          test -n "$(find release-files -name '*.exe' -print -quit)" || {
            echo '::error::no Windows .exe artifact'; exit 1; }
          test -n "$(find release-files -name '*.dmg' -print -quit)" || {
            echo '::error::no macOS .dmg artifact'; exit 1; }
          ls -lh release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
