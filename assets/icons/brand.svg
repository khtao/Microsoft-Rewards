<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 顶部栏品牌图标：积分奖章。橙色渐变外环 + 白色五角星，比放大镜更贴合
       「Microsoft Rewards 积分」主题；浅色 / 深色主题下都不依赖文字颜色。 -->
  <defs>
    <linearGradient id="brandRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#E85D04"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#brandRing)"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.4"/>
  <path d="M32 16.5 L36.4 26 L46.6 27.4 L39 34.2 L41 44.4 L32 39.3 L23 44.4 L25 34.2 L17.4 27.4 L27.6 26 Z"
        fill="#FFFFFF"/>
  <circle cx="48.5" cy="15.5" r="3" fill="#FFE0B2"/>
  <circle cx="15" cy="47" r="2.3" fill="#FFE0B2"/>
</svg>
